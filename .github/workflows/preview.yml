name: Preview Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Build Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        id: build
        run: |
          npm run build
          echo "page_count=$(find dist -name '*.html' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Comment build result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const pageCount = '${{ steps.build.outputs.page_count }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              '## ✅ Preview Build Passed',
              '',
              `| Detail | Value |`,
              `|--------|-------|`,
              `| Commit | \`${sha}\` |`,
              `| Pages generated | ${pageCount} |`,
              `| Build status | ✅ Success |`,
              '',
              '_Deploy to production will happen automatically when this PR is merged._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Preview Build')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
